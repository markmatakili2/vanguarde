<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Vanguard Rise Limited</title>
    <link rel="stylesheet" href="admin-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Vanguard Rise</h2>
                <p>Admin Panel</p>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="active">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="successstories.html">
                    <i class="fas fa-star"></i> Success Stories
                </a>
                <a href="investments.html">
                    <i class="fas fa-chart-pie"></i> Investments
                </a>
                <a href="realestate.html">
                    <i class="fas fa-building"></i> Real Estate
                </a>
                <a href="phillanthropy.html">
                    <i class="fas fa-heart"></i> Philanthropy
                </a>
            </nav>
            <div class="sidebar-logout">
                <a href="../index.html">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <div class="main-content">
            <div class="topbar">
                <h1 class="topbar-title">Dashboard</h1>
                <div class="topbar-right">
                    <div class="profile-icon" title="Admin Profile">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-icon">
                            <i class="fas fa-tasks"></i>
                        </div>
                        <div class="stat-card-number">12</div>
                        <div class="stat-card-label">Active Projects</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-icon">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="stat-card-number">8</div>
                        <div class="stat-card-label">Real Estate Listings</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-card-number">15</div>
                        <div class="stat-card-label">Success Stories</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-icon">
                            <i class="fas fa-chart-pie"></i>
                        </div>
                        <div class="stat-card-number">6</div>
                        <div class="stat-card-label">Investment Opportunities</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-icon">
                            <i class="fas fa-heart"></i>
                        </div>
                        <div class="stat-card-number">5</div>
                        <div class="stat-card-label">Ongoing Programs</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-card-number">234</div>
                        <div class="stat-card-label">Total Beneficiaries</div>
                    </div>
                </div>

                <div style="background: white; padding: 30px; border-radius: 12px; text-align: center; color: #999;">
                    <i class="fas fa-chart-bar" style="font-size: 3rem; margin-bottom: 20px; display: block;"></i>
                    <p>Dashboard overview and analytics will appear here</p>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
    <script>
        setActiveMenu('a[href="dashboard.html"]');
    </script>
</body>
</html>
